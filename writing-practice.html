<!--
  ════════════════════════════════════════════════════════════════════
  WRITING PRACTICE APP  (single file, no frameworks, no backend)
  Just double-click this file in Google Chrome to run.
  Best used with a touchscreen + stylus (Pointer Events API), but also
  works with mouse/finger.

  Bilingual: English (en-US) + Hindi (hi-IN). Toggle at top-right.
  Practice basic pre-writing strokes (straight / sleeping / slanting /
  curved / circle) and capital letters A-Z.

  Each practice item is defined as one or more "strokes" — a stroke is
  just an array of [x,y] points in an abstract 100 x 140 coordinate
  space (see geometry helpers below). The left panel animates a glowing
  dot tracing the stroke(s) in order (showing direction); the right
  panel shows the same dotted outline and lets the child draw over it
  with a stylus/finger/mouse, then "Check" scores how much of the
  dotted path was covered.
  ════════════════════════════════════════════════════════════════════
-->

<style>
  :root{
    --pink:#ff5fa2; --purple:#a259ff; --blue:#3aa0ff; --green:#2ecc71;
    --orange:#ff9f1c; --yellow:#ffd23f; --red:#ff5a5f; --teal:#21d4b4;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:"Comic Sans MS","Comic Sans","Baloo 2","Chalkboard SE",
                "Segoe UI",system-ui,sans-serif;
    background:linear-gradient(135deg,#ffe6f2 0%,#e6f0ff 50%,#e8fff0 100%);
    color:#33335a; overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  .screen{ display:none; height:100vh; height:100dvh; padding:12px;
           flex-direction:column; align-items:center; gap:10px; overflow:hidden; }
  .screen.active{ display:flex; animation:pop .35s ease; }
  @keyframes pop{ from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);} }

  h1{ font-size:clamp(24px,5.5vw,42px); margin:6px; color:var(--purple);
      text-shadow:2px 2px 0 #fff; }
  .subtitle{ font-size:clamp(16px,3vw,22px); color:#555; margin:0 0 4px; }

  .topbar{ position:fixed; top:8px; left:0; right:0; display:flex;
           justify-content:space-between; padding:0 12px; z-index:50; gap:8px; }
  .pill{ font-size:16px; font-weight:bold; padding:10px 16px; border:none;
         border-radius:40px; cursor:pointer; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.2);
         min-height:44px; }
  .pill:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.2); }
  #homeBtn{ background:var(--blue); }
  #langBtn{ background:var(--orange); }

  .btn{ border:none; border-radius:24px; color:#fff; cursor:pointer;
        font-family:inherit; font-weight:bold; box-shadow:0 6px 0 rgba(0,0,0,.18);
        transition:transform .08s; display:flex; align-items:center;
        justify-content:center; gap:10px; }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .btn-big{ font-size:clamp(18px,3.2vw,26px); padding:16px 22px; min-height:64px; }
  .btn-sm{ font-size:clamp(14px,2.4vw,18px); padding:10px 16px; min-height:48px; }
  .menu-btn{ width:min(92vw,560px); font-size:clamp(18px,4vw,28px);
             padding:16px; min-height:78px; }

  #screen-menu, #screen-letters, #screen-numbers{ justify-content:flex-start; padding-top:60px; overflow-y:auto; }
  #screen-greet{ justify-content:center; gap:16px; }
  #nameInput{ font-family:inherit; font-size:26px; text-align:center;
    padding:14px 18px; border:4px dashed var(--purple); border-radius:20px;
    width:min(85vw,420px); outline:none; }
  .start{ background:var(--green); animation:wiggle 1.2s ease-in-out infinite; }
  @keyframes wiggle{ 0%,100%{transform:rotate(-2deg) scale(1);} 50%{transform:rotate(2deg) scale(1.04);} }

  /* ── Reward settings panel (on the menu) ── */
  .reward-panel{ width:min(92vw,560px); background:rgba(255,255,255,.75); border-radius:22px;
                 padding:18px 20px 22px; margin:18px 0 30px; box-shadow:0 6px 20px rgba(0,0,0,.08); }
  .reward-panel h2{ font-size:clamp(18px,3.6vw,24px); color:var(--purple); margin:0 0 12px; text-align:center; }
  .settings-row{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
                 gap:8px; margin-bottom:12px; font-size:clamp(14px,2.6vw,17px); }
  .settings-row label{ flex:1 1 200px; }
  .settings-row select{ font-family:inherit; font-size:16px; padding:8px 12px; border-radius:12px;
                 border:2px solid var(--purple); background:#fff; color:#33335a; }
  #pickVideoFolderBtn, #pickVideoFilesBtn{ width:100%; margin-top:4px; }
  #videoFolderStatus{ text-align:center; margin-top:10px; }

  /* ── Reward video overlay ── */
  .reward-overlay{ position:fixed; inset:0; background:#0a0a1a; z-index:200; display:none;
                    flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .reward-overlay.show{ display:flex; }
  .reward-message{ color:#fff; font-size:clamp(22px,5vw,38px); font-weight:bold; text-align:center;
                    max-width:90vw; text-shadow:0 0 20px rgba(255,255,255,.3); animation:pop .4s ease; }
  #rewardVideo{ display:none; max-width:96vw; max-height:96vh; border-radius:16px;
                box-shadow:0 10px 50px rgba(0,0,0,.6); }

  .letter-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr));
                gap:10px; width:min(94vw,760px); }
  .letter-btn{ font-size:26px; font-weight:bold; padding:14px 0; border:none;
               border-radius:16px; background:#fff; color:var(--purple);
               box-shadow:0 5px 0 rgba(0,0,0,.15); cursor:pointer; }
  .letter-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.15); }

  /* ── Practice screen ── */
  #screen-practice{ padding-top:56px; justify-content:flex-start; }
  #practiceTitle{ font-size:clamp(20px,4vw,32px); margin:2px 0; color:var(--purple); }
  .practice-wrap{ display:flex; gap:14px; width:100%; max-width:1100px; flex:1 1 auto;
                  min-height:0; }
  .panel{ flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
          min-width:0; }
  .panel-label{ font-size:clamp(14px,2.6vw,20px); font-weight:bold; }
  .canvas-box{ width:100%; max-width:340px; aspect-ratio:5/7; background:#fff;
               border-radius:20px; box-shadow:0 6px 24px rgba(0,0,0,.15); overflow:hidden;
               position:relative; flex:1 1 auto; min-height:0; }
  .canvas-box canvas{ width:100%; height:100%; display:block; touch-action:none; }
  .panel-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #feedbackMsg{ font-size:clamp(16px,3vw,22px); font-weight:bold; min-height:1.4em; }

  @media (max-width:640px){
    .practice-wrap{ flex-direction:column; align-items:center; }
    .canvas-box{ max-width:min(70vw,300px); }
  }

  /* ── falling celebration confetti ── */
  #confettiLayer{ position:fixed; inset:0; pointer-events:none; z-index:90; overflow:hidden; }
  .confetti-piece{ position:absolute; top:-10vh; font-size:32px;
                    animation:confettiFall linear forwards; }
  @keyframes confettiFall{ to{ transform:translateY(120vh) rotate(360deg); opacity:.3; } }
</style>

<script>
/* ============================================================
   1. LANGUAGE / TRANSLATIONS
   ============================================================ */
let LANG = 'en';
const VOICE_LANG = { en:'en-US', hi:'hi-IN' };

const I18N = {
  menu:        { en:'Menu',                          hi:'मेनू' },
  welcome:     { en:'Welcome!',                       hi:'स्वागत है!' },
  askName:     { en:'What is your name?',             hi:'तुम्हारा नाम क्या है?' },
  hello:       { en:'Hello!',                         hi:'नमस्ते!' },
  appTitle:    { en:'Writing Practice',               hi:'लेखन अभ्यास' },
  chooseTitle: { en:'What do you want to practice?',  hi:'तुम क्या अभ्यास करना चाहते हो?' },
  straight:    { en:'Straight Line',                  hi:'सीधी रेखा' },
  sleeping:    { en:'Sleeping Line',                  hi:'सोई हुई रेखा' },
  slantFwd:    { en:'Slanting Line (Forward)',        hi:'तिरछी रेखा (आगे)' },
  slantBwd:    { en:'Slanting Line (Backward)',       hi:'तिरछी रेखा (पीछे)' },
  curved:      { en:'Curved Line',                    hi:'घुमावदार रेखा' },
  circle:      { en:'Circle',                         hi:'गोला' },
  letters:     { en:'Write Letters',                  hi:'अक्षर लिखो' },
  pickLetter:  { en:'Pick a letter',                  hi:'एक अक्षर चुनो' },
  numbers:     { en:'Write Numbers',                  hi:'गिनती लिखो' },
  pickNumber:  { en:'Pick a number',                  hi:'एक संख्या चुनो' },
  rewardSettingsTitle:{ en:'🎁 Reward Settings',       hi:'🎁 इनाम सेटिंग्स' },
  rewardEveryLabel:{ en:'Give a reward after this many correct draws:',
                      hi:'इतनी सही ड्राइंग के बाद इनाम दो:' },
  rewardDurationLabel:{ en:'Video length:',            hi:'वीडियो की लंबाई:' },
  pickVideoFolder:{ en:'Choose Video Folder',          hi:'वीडियो फ़ोल्डर चुनो' },
  pickVideoFiles:{ en:'Choose Video Files',            hi:'वीडियो फ़ाइलें चुनो' },
  noVideosChosen:{ en:'No videos chosen yet.',         hi:'अभी तक कोई वीडियो नहीं चुना।' },
  noVideosFound:{ en:'No supported videos in that selection.', hi:'चुनी गई फ़ाइलों में कोई सही वीडियो नहीं मिला।' },
  watch:       { en:'Watch',                          hi:'देखो' },
  yourTurn:    { en:'Your Turn',                      hi:'अब तुम्हारी बारी' },
  replay:      { en:'Replay',                         hi:'फिर दिखाओ' },
  undo:        { en:'Undo',                           hi:'पूर्ववत' },
  clear:       { en:'Clear',                          hi:'मिटाओ' },
  check:       { en:'Check',                          hi:'जाँचो' },
  prev:        { en:'Previous',                       hi:'पिछला' },
  next:        { en:'Next',                           hi:'आगे' },
};

const SAY = {
  greet:      (n)=> LANG==='en' ? `Hello ${n}! Let's practice writing!`
                                 : `नमस्ते ${n}! चलो लिखना सीखें!`,
  yourTurn:   ()=> LANG==='en' ? `Now you try! Use your stylus or finger.`
                               : `अब तुम कोशिश करो! स्टाइलस या उंगली का उपयोग करो।`,
  great:      ()=> LANG==='en' ? `Wonderful! Great job!` : `शाबाश! बहुत बढ़िया!`,
  tryAgain:   ()=> LANG==='en' ? `Good try! Follow the dots and try again.`
                               : `अच्छी कोशिश! बिंदुओं का पालन करो और फिर से कोशिश करो।`,
  drawFirst:  ()=> LANG==='en' ? `Draw over the dots first!` : `पहले बिंदुओं पर बनाओ!`,
  keepGoing:  ()=> LANG==='en' ? `Keep going! Follow the glowing dot.` : `चलते रहो! चमकते बिंदु का पालन करो।`,
  rewardIntro:(n)=> LANG==='en' ? `Hi ${n}, you are amazing and you are doing great. Enjoy your video!`
                                : `नमस्ते ${n}, तुम कमाल हो और बहुत अच्छा कर रहे हो। अपना वीडियो देखो!`,
  rewardOutro:()=> LANG==='en' ? `Okay, let's focus on study again!` : `ठीक है, चलो फिर से पढ़ाई पर ध्यान दें!`,
  letterIntro:(L,word)=> LANG==='en' ? `Let's write the letter ${L}. ${L} for ${word}!`
                                     : `चलो अक्षर ${L} लिखते हैं। ${L} से ${word}!`,
  numberIntro:(N,word)=> LANG==='en' ? `Let's write the number ${N}. It's ${word}!`
                                     : `चलो संख्या ${N} लिखते हैं। यह ${word} है!`,
};

function t(key){ return (I18N[key] && I18N[key][LANG]) || key; }
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.getElementById('langBtn').textContent = LANG==='en' ? '🌐 हिंदी' : '🌐 English';
  document.documentElement.lang = VOICE_LANG[LANG];
}

/* ============================================================
   2. GEOMETRY HELPERS
      All strokes live in an abstract 100 (wide) x 140 (tall) space.
   ============================================================ */
const VIEW_W = 100, VIEW_H = 140;

function line(x1,y1,x2,y2){ return [[x1,y1],[x2,y2]]; }
function arc(cx,cy,rx,ry,startDeg,endDeg,steps){
  steps = steps || 20;
  const out = [];
  for(let i=0;i<=steps;i++){
    const deg = startDeg + (endDeg-startDeg)*(i/steps);
    const rad = deg*Math.PI/180;
    out.push([cx+rx*Math.cos(rad), cy+ry*Math.sin(rad)]);
  }
  return out;
}
function pts(...items){
  const out=[];
  items.forEach(it=>{
    if(Array.isArray(it) && Array.isArray(it[0])) out.push(...it);
    else out.push(it);
  });
  return out;
}
// Smooth a sparse hand-authored polyline into a flowing curve (Catmull-Rom
// spline through the same key points). Short strokes (<4 points) — mostly
// straight lines and intentional sharp corners like in K, M, Z — pass through
// untouched; arcs are already smooth circles so re-splining them is a no-op.
function catmullRom(points, samplesPerSeg){
  if(points.length < 4) return points;
  samplesPerSeg = samplesPerSeg || 8;
  const out = [];
  const n = points.length;
  for(let i=0;i<n-1;i++){
    const p0 = points[i-1] || points[i];
    const p1 = points[i];
    const p2 = points[i+1];
    const p3 = points[i+2] || p2;
    for(let s=0;s<samplesPerSeg;s++){
      const t = s/samplesPerSeg, t2=t*t, t3=t2*t;
      const x = 0.5*((2*p1[0]) + (p2[0]-p0[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (3*p1[0]-p0[0]-3*p2[0]+p3[0])*t3);
      const y = 0.5*((2*p1[1]) + (p2[1]-p0[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (3*p1[1]-p0[1]-3*p2[1]+p3[1])*t3);
      out.push([x,y]);
    }
  }
  out.push(points[n-1]);
  return out;
}
function smoothStrokes(strokes){ return strokes.map(s=> catmullRom(s, 8)); }
function polyLength(p){
  let d=0;
  for(let i=1;i<p.length;i++) d += Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]);
  return d;
}
// evenly re-space n points along a polyline (by arc length)
function resample(p, n){
  if(p.length<2) return [p[0]||[0,0]];
  n = Math.max(2, n);
  const step = polyLength(p) / (n-1);
  const out = [p[0]];
  let px=p[0][0], py=p[0][1], nextIdx=1;
  for(let k=1;k<n;k++){
    let need = step;
    while(need > 1e-9 && nextIdx < p.length){
      const B = p[nextIdx];
      const segRemaining = Math.hypot(B[0]-px, B[1]-py);
      if(segRemaining <= need + 1e-9){
        need -= segRemaining; px=B[0]; py=B[1]; nextIdx++;
      } else {
        const ratio = need/segRemaining;
        px = px + (B[0]-px)*ratio; py = py + (B[1]-py)*ratio;
        need = 0;
      }
    }
    out.push([px,py]);
  }
  return out;
}

// map a digit's unit-cell points (0-60 wide, 0-100 tall) into a target box
function placeDigit(strokes, x0, width, y0, height){
  return strokes.map(s=> s.map(p=> [ x0 + (p[0]/60)*width, y0 + (p[1]/100)*height ]));
}
function numberStrokes(n){

  ];
}

function tone(freq, start, dur, type='sine', vol=0.25){
  const c = ac();
  const o = c.createOscillator(), g = c.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
  const t0 = c.currentTime + start;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.start(t0); o.stop(t0+dur+0.02);
}

/* ============================================================
   7. CANVAS / GUIDE RENDERING
   ============================================================ */
function fitCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  const w = Math.max(1, Math.round(cssW*dpr)), h = Math.max(1, Math.round(cssH*dpr));
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
}
function computeTransform(canvas){
  const pad = canvas.width*0.06;
  const availW = canvas.width - pad*2, availH = canvas.height - pad*2;
  const scale = Math.min(availW/VIEW_W, availH/VIEW_H);
  return { scale, offX:(canvas.width - VIEW_W*scale)/2, offY:(canvas.height - VIEW_H*scale)/2 };
}
function toCanvas(tr, p){ return [tr.offX + p[0]*tr.scale, tr.offY + p[1]*tr.scale]; }

function drawDottedStroke(ctx, tr, strokePts, color){
  const len = polyLength(strokePts);
  const count = Math.max(2, Math.round(len/7)+1);
  resample(strokePts, count).forEach(p=>{
    const c = toCanvas(tr, p);
    ctx.beginPath(); ctx.fillStyle = color;
    ctx.arc(c[0], c[1], Math.max(2, tr.scale*1.5), 0, Math.PI*2); ctx.fill();
  });
}
function drawGuide(canvas, ctx, item, color){
  fitCanvas(canvas);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const tr = computeTransform(canvas);
  item.strokes.forEach(s=> drawDottedStroke(ctx, tr, s, color));
  return tr;
}
function drawSolidStroke(ctx, tr, points, color, width){
  if(points.length<2) return;
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  const c0 = toCanvas(tr, points[0]); ctx.moveTo(c0[0], c0[1]);
  for(let i=1;i<points.length;i++){ const c = toCanvas(tr, points[i]); ctx.lineTo(c[0], c[1]); }
  ctx.stroke();
}

/* ============================================================
   8. WATCH PANEL — animated tracing demo
   ============================================================ */
const watchCanvas = document.getElementById('watchCanvas');
const watchCtx = watchCanvas.getContext('2d');
let watchState = { raf:null, timeout:null, tr:null, item:null };

function stopWatchAnim(){
  if(watchState.raf) cancelAnimationFrame(watchState.raf);
  if(watchState.timeout) clearTimeout(watchState.timeout);
  watchState.raf = null; watchState.timeout = null;
}
function startWatchAnim(item){
  stopWatchAnim();
  watchState.item = item;
  watchState.tr = drawGuide(watchCanvas, watchCtx, item, '#d8d0f5');
  runStroke(0);

  function runStroke(strokeIdx){
    if(strokeIdx >= item.strokes.length){
      watchState.timeout = setTimeout(()=> runStroke(0), 900);
      drawGuide(watchCanvas, watchCtx, item, '#d8d0f5');
      return;
    }
    const strokePts = item.strokes[strokeIdx];
    const len = polyLength(strokePts);
    const duration = Math.min(1800, Math.max(650, len*7));
    const dense = resample(strokePts, 90);
    const start = performance.now();

    function frame(now){
      const p = Math.min(1, (now-start)/duration);
      const idx = Math.max(0, Math.min(dense.length-1, Math.floor(p*(dense.length-1))));
      if(!dense[idx]) return;
      const tr = drawGuide(watchCanvas, watchCtx, item, '#d8d0f5');
      for(let s=0;s<strokeIdx;s++) drawSolidStroke(watchCtx, tr, item.strokes[s], '#a259ff', Math.max(3,tr.scale*1.8));
      drawSolidStroke(watchCtx, tr, dense.slice(0, idx+1), '#ff5fa2', Math.max(3,tr.scale*1.8));
      const tip = toCanvas(tr, dense[idx]);
      watchCtx.beginPath(); watchCtx.fillStyle='#ffd23f'; watchCtx.strokeStyle='#e8590c'; watchCtx.lineWidth=2;
      watchCtx.arc(tip[0], tip[1], Math.max(5,tr.scale*2.6), 0, Math.PI*2); watchCtx.fill(); watchCtx.stroke();
      if(p<1) watchState.raf = requestAnimationFrame(frame);
      else watchState.timeout = setTimeout(()=> runStroke(strokeIdx+1), 260);
    }
    watchState.raf = requestAnimationFrame(frame);
  }
}
document.getElementById('replayBtn').onclick = ()=>{ ac(); startWatchAnim(currentItem); };

/* ============================================================
   9. DRAW PANEL — guided connect-the-dots tracing
      The next dot to touch glows (animated pulse). Ink is only drawn
      when the pointer actually connects that dot, in the right order —
      anything off-path or out of order leaves no mark at all.
   ============================================================ */
const drawCanvas = document.getElementById('drawCanvas');
const drawCtx = drawCanvas.getContext('2d');
let drawTr = null;
const TOL_ADVANCE = 8; // how close ink must land to the next dot to confirm it
let targetStrokes = [];   // array of dot-arrays, one per guide stroke
let strokeCursor = 0;     // which stroke is currently being traced
let dotCursor = 0;        // how many dots of that stroke are confirmed so far
let activePointerId = null;
let completed = false;
let glowRaf = null;

function buildTargetStrokes(item){
  return item.strokes.map(s=> resample(s, Math.max(2, Math.round(polyLength(s)/7)+1)));
}
function dist(a,b){ return Math.hypot(a[0]-b[0], a[1]-b[1]); }
function nextDot(){ return strokeCursor<targetStrokes.length ? targetStrokes[strokeCursor][dotCursor] : null; }

function abstractFromEvent(evt){
  const rect = drawCanvas.getBoundingClientRect();
  const scaleX = drawCanvas.width/rect.width, scaleY = drawCanvas.height/rect.height;
  const px = (evt.clientX-rect.left)*scaleX, py = (evt.clientY-rect.top)*scaleY;
  return [ (px-drawTr.offX)/drawTr.scale, (py-drawTr.offY)/drawTr.scale ];
}
// advance through as many consecutive in-order dots as this point reaches
function tryAdvance(pt){
  while(strokeCursor < targetStrokes.length){
    const dots = targetStrokes[strokeCursor];
    if(dotCursor >= dots.length){ strokeCursor++; dotCursor = 0; continue; }
    if(dist(pt, dots[dotCursor]) <= TOL_ADVANCE){ dotCursor++; continue; }
    break;
  }
  if(strokeCursor >= targetStrokes.length) onFullyTraced();
}
function redrawUserCanvas(now){
  drawTr = drawGuide(drawCanvas, drawCtx, currentItem, '#e3d6ff');
  const width = Math.max(4, drawTr.scale*2.2);
  targetStrokes.forEach((dots,i)=>{
    const confirmedN = i<strokeCursor ? dots.length : (i===strokeCursor ? dotCursor : 0);
    if(confirmedN>=2) drawSolidStroke(drawCtx, drawTr, dots.slice(0,confirmedN), '#a259ff', width);
  });
  const dot = nextDot();
  if(dot){
    const t = (now!=null ? now : performance.now())/220;
    const pulse = 0.5 + 0.5*Math.sin(t);
    const baseR = Math.max(6, drawTr.scale*2.2);
    const c = toCanvas(drawTr, dot);
    drawCtx.beginPath();
    drawCtx.fillStyle = `rgba(255,178,36,${0.22+0.28*pulse})`;
    drawCtx.arc(c[0], c[1], baseR*(1.6+0.5*pulse), 0, Math.PI*2); drawCtx.fill();
    drawCtx.beginPath();
    drawCtx.fillStyle='#ffd23f'; drawCtx.strokeStyle='#e8590c'; drawCtx.lineWidth=2;
    drawCtx.arc(c[0], c[1], baseR, 0, Math.PI*2);
    drawCtx.fill(); drawCtx.stroke();
  }
}
function stopGlow(){ if(glowRaf) cancelAnimationFrame(glowRaf); glowRaf=null; }
function startGlow(){
  stopGlow();
  function frame(now){
    redrawUserCanvas(now);
    if(!completed) glowRaf = requestAnimationFrame(frame);
  }
  glowRaf = requestAnimationFrame(frame);
}
drawCanvas.addEventListener('contextmenu', e=> e.preventDefault());
drawCanvas.addEventListener('pointerdown', e=>{
  if(activePointerId!==null || completed) return;
  ac(); activePointerId = e.pointerId;
  try{ drawCanvas.setPointerCapture(e.pointerId); }catch(err){}
  tryAdvance(abstractFromEvent(e));
  e.preventDefault();
});
drawCanvas.addEventListener('pointermove', e=>{
  if(e.pointerId!==activePointerId) return;
  tryAdvance(abstractFromEvent(e));
  e.preventDefault();
});
function endStroke(e){
  if(e.pointerId!==activePointerId) return;
  activePointerId = null;
}
drawCanvas.addEventListener('pointerup', endStroke);
drawCanvas.addEventListener('pointercancel', endStroke);
drawCanvas.addEventListener('pointerleave', e=>{ if(e.pointerId===activePointerId) endStroke(e); });

document.getElementById('undoBtn').onclick = ()=>{

  strokeCursor = 0; dotCursor = 0; completed = false;
  activePointerId = null;
  feedbackEl.textContent = '';
  show('screen-practice');
  updatePracticeHeader();
  // layout settles before measuring canvas size
  requestAnimationFrame(()=>{
    startGlow();
    startWatchAnim(currentItem);
  });
  speakPrompt();
}
function nextItem(){ openPractice(currentCollection, (currentIndex+1)%currentCollection.length); }
function prevItem(){ openPractice(currentCollection, (currentIndex-1+currentCollection.length)%currentCollection.length); }

/* ============================================================
   12c. REWARD SYSTEM — video reward after N correct draws
   ============================================================ */
function loadNum(key, fallback){
  try{ const v = parseInt(localStorage.getItem(key),10); return isNaN(v) ? fallback : v; }catch(e){ return fallback; }
}
function saveNum(key, val){ try{ localStorage.setItem(key, val); }catch(e){} }

let rewardConfig = { every: loadNum('wp_rewardEvery', 3), duration: loadNum('wp_rewardDuration', 60) };
let rewardVideos = [];
let correctStreak = 0;
let rewardTimeout = null;

const rewardEverySelect = document.getElementById('rewardEverySelect');
const rewardDurationSelect = document.getElementById('rewardDurationSelect');
rewardEverySelect.value = String(rewardConfig.every);
rewardDurationSelect.value = String(rewardConfig.duration);
rewardEverySelect.onchange = ()=>{
  rewardConfig.every = parseInt(rewardEverySelect.value,10); saveNum('wp_rewardEvery', rewardConfig.every);
};
rewardDurationSelect.onchange = ()=>{
  rewardConfig.duration = parseInt(rewardDurationSelect.value,10); saveNum('wp_rewardDuration', rewardConfig.duration);
};

function isVideoFile(f){
  const type = (f.type||'').toLowerCase();
  if(type.startsWith('video')) return true;
  const ext = (f.name.split('.').pop()||'').toLowerCase();
  return ['mp4','webm','ogg','ogv','mov','m4v','avi','mkv','3gp','3g2','ts'].includes(ext);
}
function updateVideoFolderStatus(){
  const el = document.getElementById('videoFolderStatus');
  el.textContent = rewardVideos.length
    ? ((LANG==='en') ? `🎬 ${rewardVideos.length} video(s) ready` : `🎬 ${rewardVideos.length} वीडियो तैयार हैं`)
    : t('noVideosChosen');
}
function handleVideoSelection(e){
  rewardVideos = Array.from(e.target.files || []).filter(isVideoFile);
  document.getElementById('videoFolderStatus').textContent = rewardVideos.length
    ? ((LANG==='en') ? `🎬 ${rewardVideos.length} video(s) ready` : `🎬 ${rewardVideos.length} वीडियो तैयार हैं`)
    : t('noVideosFound');
}
document.getElementById('pickVideoFolderBtn').onclick = ()=>{ ac(); document.getElementById('videoFolderInput').click(); };
document.getElementById('pickVideoFilesBtn').onclick = ()=>{ ac(); document.getElementById('videoFilesInput').click(); };
document.getElementById('videoFolderInput').onchange = handleVideoSelection;
document.getElementById('videoFilesInput').onchange = handleVideoSelection;
updateVideoFolderStatus();

function stopRewardVideo(){
  const vid = document.getElementById('rewardVideo');
  vid.onerror = null;
  vid.pause();
  if(vid.src) URL.revokeObjectURL(vid.src);
  vid.removeAttribute('src'); vid.load();
  vid.style.display = 'none';
}
// Progression here is purely timer-driven (not chained to speech onend) so the
// reward still runs correctly even if speechSynthesis has no voices available.
function showVideoReward(onDone){
  const ov = document.getElementById('rewardOverlay');
  const msgEl = document.getElementById('rewardMessage');
  ov.classList.add('show');
  msgEl.style.display = 'block';
  msgEl.textContent = SAY.rewardIntro(childName);
  speak(SAY.rewardIntro(childName));
  rewardTimeout = setTimeout(()=> playRewardVideo(onDone, []), 2200);
}
// Tries a random not-yet-tried video; if it fails to decode/play (unsupported
// format), tries another rather than leaving a blank screen. Only starts the
// "how long to show it" timer once something is actually confirmed playing.
function playRewardVideo(onDone, triedIndices){
  clearTimeout(rewardTimeout); // discard any pending timer from an abandoned attempt
  if(!rewardVideos.length || triedIndices.length >= rewardVideos.length){
    rewardTimeout = setTimeout(()=> finishReward(onDone), 800);
    return;
  }
  const msgEl = document.getElementById('rewardMessage');
  const vid = document.getElementById('rewardVideo');
  let idx;
  do{ idx = Math.floor(Math.random()*rewardVideos.length); }while(triedIndices.includes(idx));
  triedIndices.push(idx);

  msgEl.style.display = 'none';
  vid.style.display = 'block';
  vid.loop = true; vid.muted = false;
  vid.onerror = null;
  if(vid.src) URL.revokeObjectURL(vid.src);
  vid.src = URL.createObjectURL(rewardVideos[idx]);
  vid.currentTime = 0;

  const tryAnother = ()=>{ vid.onerror = null; playRewardVideo(onDone, triedIndices); };
  vid.onerror = tryAnother;
  const onPlaying = ()=>{ rewardTimeout = setTimeout(()=> finishReward(onDone), rewardConfig.duration*1000); };
  vid.play().then(onPlaying).catch(()=>{
    vid.muted = true;
    vid.play().then(onPlaying).catch(tryAnother);
  });
}
function finishReward(onDone){
  stopRewardVideo();
  const msgEl = document.getElementById('rewardMessage');
  msgEl.style.display = 'block';
  msgEl.textContent = SAY.rewardOutro();
  speak(SAY.rewardOutro());
  rewardTimeout = setTimeout(()=>{
    document.getElementById('rewardOverlay').classList.remove('show');
    if(onDone) onDone();
  }, 2200);
}
function cancelReward(){
  clearTimeout(rewardTimeout); rewardTimeout = null;
  const ov = document.getElementById('rewardOverlay');
  if(ov.classList.contains('show')){ stopRewardVideo(); ov.classList.remove('show'); }
}
